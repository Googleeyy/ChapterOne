# GatewayClass - defines which controller implements this Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway
spec:
  controllerName: kgateway.dev/gateway-controller

---

# Gateway - the actual ingress point for traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: library-e2e-gateway
  namespace: chapterone
  labels:
    app: library-e2e
    component: gateway
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "chapterone.local"
      allowedRoutes:
        namespaces:
          from: Same

---

# HTTPRoute - routes traffic to frontend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: chapterone
  labels:
    app: library-e2e
    component: gateway
spec:
  parentRefs:
    - name: library-e2e-gateway
  hostnames:
    - "chapterone.local"
  rules:
    # Route / (root) to frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80

---

# HTTPRoute - routes traffic to API services
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: chapterone
  labels:
    app: library-e2e
    component: gateway
spec:
  parentRefs:
    - name: library-e2e-gateway
  hostnames:
    - "chapterone.local"
  rules:
    # Route /api/books/* to book-service (strip /api prefix)
    - matches:
        - path:
            type: PathPrefix
            value: /api/books
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: book-service
          port: 8081
    # Route /api/users/* to user-service
    - matches:
        - path:
            type: PathPrefix
            value: /api/users
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: user-service
          port: 8082
    # Route /api/borrows/* to borrow-service
    - matches:
        - path:
            type: PathPrefix
            value: /api/borrows
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: borrow-service
          port: 8083
    # Route /health to book-service for health checks
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: book-service
          port: 8081
