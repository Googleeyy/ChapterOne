apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bookService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.bookService.name }}
    app.kubernetes.io/name: {{ .Values.bookService.name }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: {{ .Values.global.appName }}
spec:
  replicas: {{ .Values.bookService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.bookService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.bookService.name }}
        app.kubernetes.io/name: {{ .Values.bookService.name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.bookService.name }}
          image: "{{ .Values.bookService.image.repository }}:{{ .Values.bookService.image.tag }}"
          imagePullPolicy: {{ .Values.bookService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.bookService.port }}
              protocol: TCP
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017/chapterone_books
          resources:
            requests:
              cpu: {{ .Values.bookService.resources.requests.cpu }}
              memory: {{ .Values.bookService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.bookService.resources.limits.cpu }}
              memory: {{ .Values.bookService.resources.limits.memory }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.bookService.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.bookService.port }}
            initialDelaySeconds: 90
            periodSeconds: 15
