apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.borrowService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.borrowService.name }}
    app.kubernetes.io/name: {{ .Values.borrowService.name }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: {{ .Values.global.appName }}
spec:
  replicas: {{ .Values.borrowService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.borrowService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.borrowService.name }}
        app.kubernetes.io/name: {{ .Values.borrowService.name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.mongodb.primaryHost }} {{ .Values.mongodb.port }}; do
                echo "Waiting for MongoDB..."
                sleep 2
              done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: {{ .Values.borrowService.name }}
          image: "{{ .Values.borrowService.image.repository }}:{{ .Values.borrowService.image.tag }}"
          imagePullPolicy: {{ .Values.borrowService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.borrowService.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.borrowService.name }}-config
            - secretRef:
                name: {{ .Values.borrowService.secretName }}
          resources:
            requests:
              cpu: {{ .Values.borrowService.resources.requests.cpu }}
              memory: {{ .Values.borrowService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.borrowService.resources.limits.cpu }}
              memory: {{ .Values.borrowService.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: {{ .Values.borrowService.healthPath }}
              port: {{ .Values.borrowService.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.borrowService.healthPath }}
              port: {{ .Values.borrowService.port }}
            initialDelaySeconds: 90
            periodSeconds: 15
