{{- $services := dict "book" .Values.bookService "user" .Values.userService "borrow" .Values.borrowService -}}
{{- range $name, $service := $services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "library-e2e.fullname" $ }}-{{ $name }}-service
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "library-e2e.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
    app: {{ $name }}-service
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "library-e2e.name" $ }}
      app.kubernetes.io/component: backend
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        {{- include "library-e2e.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: backend
        app: {{ $name }}-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongo-svc.{{ $.Values.global.environment }}.svc.cluster.local 27017; do
                echo "Waiting for MongoDB..."
                sleep 2
              done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: {{ $name }}-service
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq $name "user" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $service.probes.readiness.path }}
              port: {{ $service.probes.readiness.port }}
            initialDelaySeconds: {{ $service.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $service.probes.liveness.path }}
              port: {{ $service.probes.liveness.port }}
            initialDelaySeconds: {{ $service.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
{{- end }}
